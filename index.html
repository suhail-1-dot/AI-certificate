<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sysmon // live agent</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    height: 100%; background: #05070a; color: #c8d0dc;
    font-family: Consolas, "SF Mono", Menlo, monospace;
    font-size: 13px; overflow: hidden;
}
.topbar {
    height: 36px; background: #0a0d12; border-bottom: 1px solid #141a22;
    display: flex; align-items: center; padding: 0 14px;
    font-size: 12px; color: #6b7688;
    justify-content: space-between; user-select: none;
}
.topbar .left, .topbar .right { display: flex; align-items: center; gap: 18px; }
.brand { color: #e8edf5; font-weight: bold; letter-spacing: 1px; }
.brand b { color: #7aa2c8; }
.stat { display: flex; align-items: center; gap: 6px; }
.stat .l { color: #4a5464; }
.stat .v { color: #a8b4c4; }
.led { width: 7px; height: 7px; border-radius: 50%; background: #7aa2c8; box-shadow: 0 0 6px currentColor; color: #7aa2c8; }
.led.blink { animation: blink 1.2s steps(2) infinite; }
.led.bad { background: #c96666; color: #c96666; }
@keyframes blink { 50% { opacity: 0.3; } }

.main { height: calc(100% - 36px); display: grid; grid-template-columns: 1fr 560px; }

.term-wrap {
    background: #05070a; border-right: 1px solid #141a22;
    display: flex; flex-direction: column; height: 100%; overflow: hidden;
}
.term {
    flex: 1; padding: 16px 18px 8px; overflow-y: auto;
    font-size: 12.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
    scrollbar-width: thin; scrollbar-color: #1a2028 #05070a;
}
.term::-webkit-scrollbar { width: 8px; }
.term::-webkit-scrollbar-thumb { background: #1a2028; }

.prompt-bar {
    border-top: 1px solid #141a22; padding: 9px 18px;
    background: #080a0e; color: #c8d0dc; font-size: 12.5px;
    display: flex; align-items: center; gap: 8px; user-select: none;
}
.prompt-bar .user { color: #7aa2c8; }
.prompt-bar .host { color: #d47a7a; }
.prompt-bar .path { color: #a8b4c4; }

.t-line { min-height: 18px; }
.t-time { color: #3a4353; margin-right: 8px; }
.t-dim   { color: #5a6578; }
.t-warn  { color: #d4a04a; }
.t-cmd   { color: #7aa2c8; }
.t-val   { color: #d8e0ec; }
.t-name  { color: #d47a7a; font-weight: bold; letter-spacing: 2px; }
.t-head  { color: #e8edf5; font-weight: bold; letter-spacing: 1px; }
.t-err   { color: #c96666; }
.t-creep { color: #d47a7a; letter-spacing: 2px; }

.cursor { display: inline-block; width: 8px; height: 14px; background: #c8d0dc; vertical-align: middle; animation: blink 1s infinite; }

.right-col { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

.info-panel {
    flex: 1; overflow-y: auto; background: #0a0d12;
    padding: 14px 16px; font-size: 12.5px; line-height: 1.6;
    scrollbar-width: thin; scrollbar-color: #1a2028 #0a0d12;
    border-bottom: 1px solid #141a22;
    font-family: Consolas, monospace;
}
.info-panel::-webkit-scrollbar { width: 8px; }
.info-panel::-webkit-scrollbar-thumb { background: #1a2028; }

.shdr {
    color: #4a5464; font-size: 10.5px; letter-spacing: 2.5px;
    text-transform: uppercase; margin: 12px 0 5px;
    padding-bottom: 3px; border-bottom: 1px dashed #1a2028;
}
.shdr:first-child { margin-top: 0; }

.gline {
    color: #b0b8c4; font-size: 12px; line-height: 1.6;
    padding: 1px 0; white-space: pre-wrap; word-break: break-word;
    display: flex; gap: 10px; align-items: baseline;
}
.gline .tag { color: #5a6578; width: 58px; flex-shrink: 0; font-size: 11px; }
.gline .key { color: #8a94a6; min-width: 200px; flex-shrink: 0; }
.gline .arrow { color: #3a4353; margin: 0 2px; }
.gline .val { color: #d8e0ec; word-break: break-word; }
.gline.priority .val { color: #e8edf5; font-weight: bold; }
.gline.battery .val {
    color: #e8edf5; font-weight: bold; font-size: 13px;
    background: #10161d; padding: 1px 8px;
    border: 1px solid #2a3a4a; border-radius: 2px;
}
.gline.err .val { color: #c96666; }
.gline.err .tag { color: #c96666; }
.gline.warn .val { color: #d4a04a; }
.gline.warn .tag { color: #d4a04a; }
.gline.dim .val { color: #6b7688; }

.upload-panel {
    background: #080a0e; border-top: 1px solid #141a22;
    padding: 12px 16px; height: 220px;
    display: none; flex-direction: column; font-size: 12px;
}
.upload-panel.show { display: flex; }

.upload-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; color: #6b7688; font-size: 11px;
    letter-spacing: 1.5px; text-transform: uppercase;
}
.upload-head .pct { color: #a8c0d8; font-weight: bold; letter-spacing: 0; font-size: 13px; }

.total-bar { height: 6px; background: #141a22; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.total-bar > i { display: block; height: 100%; background: #7aa2c8; width: 0%; transition: width 0.3s; }

.file-list { flex: 1; overflow-y: auto; font-size: 11.5px; line-height: 1.6; scrollbar-width: thin; scrollbar-color: #1a2028 #080a0e; }
.file-list::-webkit-scrollbar { width: 6px; }
.file-list::-webkit-scrollbar-thumb { background: #1a2028; }

.file-row { display: grid; grid-template-columns: 14px 1fr 60px 60px; gap: 8px; align-items: center; padding: 2px 0; color: #8a94a6; }
.file-row .icon { color: #4a5464; font-size: 12px; }
.file-row .name { color: #b0b8c4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
.file-row .bar { height: 4px; background: #141a22; border-radius: 2px; overflow: hidden; }
.file-row .bar > i { display: block; height: 100%; background: #7aa2c8; width: 0%; transition: width 0.4s; }
.file-row .status { color: #6b7688; text-align: right; font-size: 10.5px; text-transform: uppercase; }
.file-row.active .icon { color: #d4a04a; animation: blink 0.8s infinite; }
.file-row.active .status { color: #d4a04a; }
.file-row.done .icon { color: #a8c0d8; }
.file-row.done .status { color: #a8c0d8; }

.upload-foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10.5px; color: #4a5464; }
.upload-foot .v { color: #a8b4c4; }

#horrorScreen { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; padding: 30px; overflow-y: auto; }
#horrorScreen.show { display: block; }
#horrorTerminal { max-width: 900px; margin: auto; color: #c8c8c8; font-size: 14px; line-height: 1.75; white-space: pre-wrap; font-family: Consolas, monospace; }
.h-line { min-height: 20px; }
.h-ok   { color: #b0b0b0; }
.h-warn { color: #d4a04a; }
.h-err  { color: #c96666; }
.h-creepy { color: #d47a7a; font-weight: bold; letter-spacing: 5px; font-size: 24px; }

.shake { animation: shake 0.28s infinite; }
@keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); } 50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,-3px); } 100% { transform: translate(2px,3px); } }
.redflash { position: fixed; inset: 0; background: #8b0000; pointer-events: none; z-index: 10000; opacity: 0; animation: flash 0.22s 3; }
@keyframes flash { 0% { opacity: 0; } 50% { opacity: 0.55; } 100% { opacity: 0; } }

#escapeBtn {
    position: fixed; bottom: 22px; right: 22px;
    background: #0a0d12; color: #a8c0d8; border: 2px solid #a8c0d8;
    padding: 12px 20px; font-family: Consolas, monospace;
    font-size: 12px; letter-spacing: 1px; cursor: pointer; z-index: 10001;
}
#escapeBtn:hover { background: #a8c0d8; color: #05070a; }

#errBanner {
    position: fixed; top: 42px; left: 12px; right: 12px;
    background: #2a0e0e; border: 1px solid #8b0000; color: #ffb0b0;
    padding: 10px 14px; font-size: 12px; z-index: 99999;
    display: none; font-family: Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
}
</style>
</head>
<body>

<div id="errBanner"></div>

<div class="topbar">
    <div class="left">
        <div class="brand">sysmon<b>::</b>live-agent</div>
        <div class="stat"><span class="led blink"></span><span class="l">status</span><span class="v">collecting</span></div>
        <div class="stat"><span class="l">pid</span><span class="v" id="pid">—</span></div>
        <div class="stat"><span class="l">session</span><span class="v" id="sessionId">—</span></div>
    </div>
    <div class="right">
        <div class="stat"><span class="l">uptime</span><span class="v" id="uptime">00:00:00</span></div>
        <div class="stat"><span class="l">local</span><span class="v" id="clock">--:--:--</span></div>
        <div class="stat"><span class="led" id="netLed"></span><span class="l">net</span><span class="v" id="netStatus">—</span></div>
    </div>
</div>

<div class="main">
    <div class="term-wrap">
        <div class="term" id="term"></div>
        <div class="prompt-bar">
            <span><span class="user">agent</span><span class="t-dim">@</span><span class="host" id="promptHost">host</span><span class="t-dim">:</span><span class="path">~</span><span class="t-dim">$</span></span>
            <span class="cursor"></span>
        </div>
    </div>

    <div class="right-col">
        <div class="info-panel" id="infoPanel"></div>
        <div class="upload-panel" id="uploadPanel">
            <div class="upload-head">
                <span>uploading profile</span>
                <span class="pct" id="totalPct">0%</span>
            </div>
            <div class="total-bar"><i id="totalBar"></i></div>
            <div class="file-list" id="fileList"></div>
            <div class="upload-foot">
                <span>speed <span class="v" id="speedVal">—</span></span>
                <span>eta <span class="v" id="etaVal">—</span></span>
                <span>sent <span class="v" id="sentVal">0 KB</span></span>
            </div>
        </div>
    </div>
</div>

<div id="horrorScreen">
    <div id="horrorTerminal"></div>
    <button id="escapeBtn">[ ESC — STOP ]</button>
</div>

<script>
const $ = id => document.getElementById(id);
const term = $("term");
const infoPanel = $("infoPanel");
const pad = n => String(n).padStart(2, "0");
const ts = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function showError(msg) {
    const b = $("errBanner");
    b.style.display = "block";
    b.textContent = "⚠ " + msg;
}
function writeTerm(html) {
    try {
        const line = document.createElement("div");
        line.className = "t-line";
        line.innerHTML = '<span class="t-time">' + ts() + '</span>' + html;
        term.appendChild(line);
        term.scrollTop = term.scrollHeight;
    } catch (e) {}
}
function writeSection(title) {
    const h = document.createElement("div");
    h.className = "shdr";
    h.textContent = "▸ " + title;
    infoPanel.appendChild(h);
    infoPanel.scrollTop = infoPanel.scrollHeight;
}
function writeInfo(key, val, opts) {
    opts = opts || {};
    const line = document.createElement("div");
    line.className = "gline"
        + (opts.priority ? " priority" : "")
        + (opts.battery ? " battery" : "")
        + (opts.err ? " err" : "")
        + (opts.warn ? " warn" : "")
        + (opts.dim ? " dim" : "");
    line.innerHTML =
        '<span class="tag">' + (opts.tag || "[detect]") + '</span>' +
        '<span class="key">' + key + '</span>' +
        '<span class="arrow">→</span>' +
        '<span class="val">' + val + '</span>';
    infoPanel.appendChild(line);
    infoPanel.scrollTop = infoPanel.scrollHeight;
}

/* ---------- TARGET ---------- */
function pickTargetName() {
    try {
        const p = (navigator.platform || "").toLowerCase();
        let code = "NODE";
        if (p.includes("win")) code = "WIN";
        else if (p.includes("mac")) code = "MAC";
        else if (p.includes("linux") && !p.includes("android")) code = "LNX";
        else if (p.includes("android")) code = "AND";
        else if (p.includes("iphone") || p.includes("ipad") || p.includes("ipod")) code = "IOS";
        return "CYBERLAB-" + code + "-" + String(Math.floor(Math.random() * 90) + 10);
    } catch (e) { return "CYBERLAB-NODE-01"; }
}
const TARGET = pickTargetName();

/* ---------- SAFE ---------- */
const info = {};
function safe(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }
function rnd(min, max, dec) {
    const v = Math.random() * (max - min) + min;
    return dec ? v.toFixed(dec) : Math.round(v);
}
function rndHex(len) {
    let s = "";
    for (let i = 0; i < len; i++) s += Math.floor(Math.random() * 16).toString(16);
    return s;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------- REAL COLLECTORS ---------- */
function collectReal() {
    const n = navigator, s = screen;

    info.platform = safe(() => n.platform || "unknown", "unknown");
    info.userAgent = safe(() => n.userAgent || "unknown", "unknown");
    info.vendor = safe(() => n.vendor || "n/a", "n/a");
    info.product = safe(() => n.product || "n/a", "n/a");
    info.appName = safe(() => n.appName || "n/a", "n/a");
    info.appVersion = safe(() => n.appVersion || "n/a", "n/a");
    info.appCodeName = safe(() => n.appCodeName || "n/a", "n/a");
    info.language = safe(() => n.language || "unknown", "unknown");
    info.languages = safe(() => (n.languages || []).join(", ") || "—", "—");
    info.timezone = safe(() => Intl.DateTimeFormat().resolvedOptions().timeZone, "unknown");
    info.tzOffset = safe(() => {
        const off = new Date().getTimezoneOffset();
        return "UTC" + (off > 0 ? "-" : "+") + Math.abs(off / 60);
    }, "UTC+0");
    info.locale = safe(() => Intl.DateTimeFormat().resolvedOptions().locale, "unknown");
    info.cookies = safe(() => n.cookieEnabled ? "true" : "false", "unknown");
    info.online = safe(() => n.onLine ? "true" : "false", "unknown");
    info.webdriver = safe(() => n.webdriver ? "yes" : "no", "no");
    info.dnt = safe(() => (n.doNotTrack === "1" || window.doNotTrack === "1") ? "on" : "off", "off");
    info.pdfViewer = safe(() => n.pdfViewerEnabled ? "yes" : "no", "n/a");
    info.plugins = safe(() => n.plugins ? n.plugins.length : 0, 0);
    info.mimeTypes = safe(() => n.mimeTypes ? n.mimeTypes.length : 0, 0);

    info.screenW = safe(() => s.width, 0);
    info.screenH = safe(() => s.height, 0);
    info.availW = safe(() => s.availWidth, 0);
    info.availH = safe(() => s.availHeight, 0);
    info.viewW = safe(() => window.innerWidth, 0);
    info.viewH = safe(() => window.innerHeight, 0);
    info.outerW = safe(() => window.outerWidth, 0);
    info.outerH = safe(() => window.outerHeight, 0);
    info.depth = safe(() => s.colorDepth + "-bit", "—");
    info.pixelDepth = safe(() => s.pixelDepth + "-bit", "—");
    info.dpr = safe(() => window.devicePixelRatio || 1, 1);
    info.orientation = safe(() => (s.orientation && s.orientation.type) || "unknown", "unknown");
    info.orientationAngle = safe(() => (s.orientation && s.orientation.angle) || 0, 0);

    info.colorGamut = safe(() =>
        matchMedia("(color-gamut: rec2020)").matches ? "rec2020" :
        matchMedia("(color-gamut: p3)").matches ? "p3" :
        matchMedia("(color-gamut: srgb)").matches ? "srgb" : "unknown", "unknown");
    info.prefScheme = safe(() => matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", "unknown");
    info.reducedMotion = safe(() => matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduce" : "no-preference", "unknown");
    info.pointerType = safe(() =>
        matchMedia("(pointer: fine)").matches ? "fine" :
        matchMedia("(pointer: coarse)").matches ? "coarse" : "none", "unknown");
    info.hover = safe(() => matchMedia("(hover: hover)").matches ? "yes" : "no", "unknown");

    info.cores = safe(() => n.hardwareConcurrency || "unknown", "unknown");
    info.memory = safe(() => n.deviceMemory ? n.deviceMemory + " GB" : "unavailable", "unavailable");
    info.touch = safe(() => n.maxTouchPoints || 0, 0);

    const c = safe(() => n.connection || n.mozConnection || n.webkitConnection, null);
    if (c) {
        info.connType = safe(() => c.effectiveType || "unknown", "unknown");
        info.connDown = safe(() => c.downlink ? c.downlink + " Mbps" : "n/a", "n/a");
        info.connRtt  = safe(() => c.rtt ? c.rtt + " ms" : "n/a", "n/a");
        info.connSave = safe(() => c.saveData ? "on" : "off", "off");
    } else { info.connType = "n/a"; info.connDown = "n/a"; info.connRtt = "n/a"; info.connSave = "n/a"; }

    try {
        const cv = document.createElement("canvas");
        const gl = cv.getContext("webgl") || cv.getContext("experimental-webgl");
        if (gl) {
            const dbg = gl.getExtension("WEBGL_debug_renderer_info");
            info.gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "hidden";
            info.gpuVendor = dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : "hidden";
            info.webgl = "supported";
            info.webglExtCount = (gl.getSupportedExtensions() || []).length;
            info.maxTexture = safe(() => gl.getParameter(gl.MAX_TEXTURE_SIZE), "n/a");
            info.webglVersion = safe(() => gl.getParameter(gl.VERSION), "n/a");
            info.glslVersion = safe(() => gl.getParameter(gl.SHADING_LANGUAGE_VERSION), "n/a");
        } else { info.gpu = "n/a"; info.gpuVendor = "n/a"; info.webgl = "no"; info.webglExtCount = 0; info.maxTexture = "n/a"; info.webglVersion = "n/a"; info.glslVersion = "n/a"; }
    } catch (e) { info.gpu = "n/a"; info.gpuVendor = "n/a"; info.webgl = "err"; info.webglExtCount = 0; info.maxTexture = "n/a"; info.webglVersion = "n/a"; info.glslVersion = "n/a"; }

    info.canvasHash = safe(() => {
        const c2 = document.createElement("canvas");
        c2.width = 200; c2.height = 40;
        const cx = c2.getContext("2d");
        cx.textBaseline = "top"; cx.font = "14px Arial";
        cx.fillStyle = "#f60"; cx.fillRect(0, 0, 100, 20);
        cx.fillStyle = "#069"; cx.fillText("fp-" + navigator.userAgent, 2, 15);
        const data = c2.toDataURL();
        let h = 0;
        for (let i = 0; i < data.length; i++) { h = ((h << 5) - h) + data.charCodeAt(i); h |= 0; }
        return Math.abs(h).toString(16).slice(0, 16);
    }, "n/a");

    info.fontCount = safe(() => {
        const baseFonts = ["monospace", "sans-serif", "serif"];
        const testFonts = ["Arial","Verdana","Times New Roman","Courier New","Georgia","Comic Sans MS","Trebuchet MS","Impact","Tahoma","Consolas","Segoe UI","Calibri","Roboto"];
        const span = document.createElement("span");
        span.style.fontSize = "72px"; span.style.position = "absolute";
        span.style.left = "-9999px"; span.textContent = "mmmmmmmmmmlli";
        document.body.appendChild(span);
        const baseSizes = {};
        baseFonts.forEach(bf => { span.style.fontFamily = bf; baseSizes[bf] = span.offsetWidth; });
        let count = 0;
        testFonts.forEach(f => {
            let found = false;
            baseFonts.forEach(bf => {
                span.style.fontFamily = '"' + f + '",' + bf;
                if (span.offsetWidth !== baseSizes[bf]) found = true;
            });
            if (found) count++;
        });
        span.remove();
        return count;
    }, "n/a");

    info.codecs = safe(() => {
        const v = document.createElement("video");
        const list = [];
        const tests = { h264: 'video/mp4; codecs="avc1.42E01E"', vp8: 'video/webm; codecs="vp8"', vp9: 'video/webm; codecs="vp9"', av1: 'video/mp4; codecs="av01.0.05M.08"' };
        for (const k in tests) if (v.canPlayType(tests[k])) list.push(k);
        return list.length ? list.join(",") : "none";
    }, "n/a");

    info.loadTime = safe(() => {
        const nav = performance.getEntriesByType("navigation")[0];
        return nav ? Math.round(nav.loadEventEnd - nav.startTime) + " ms" : "n/a";
    }, "n/a");
    info.domTime = safe(() => {
        const nav = performance.getEntriesByType("navigation")[0];
        return nav ? Math.round(nav.domContentLoadedEventEnd - nav.startTime) + " ms" : "n/a";
    }, "n/a");
    info.heap = safe(() => performance.memory
        ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + " MB" : "n/a", "n/a");
    info.heapLimit = safe(() => performance.memory
        ? (performance.memory.jsHeapSizeLimit / 1048576).toFixed(1) + " MB" : "n/a", "n/a");

    info.apis = safe(() => ({
        "mediaDevices": !!navigator.mediaDevices,
        "webrtc": !!(window.RTCPeerConnection || window.webkitRTCPeerConnection),
        "bluetooth": !!navigator.bluetooth,
        "usb": !!navigator.usb,
        "serial": !!navigator.serial,
        "hid": !!navigator.hid,
        "geolocation": !!navigator.geolocation,
        "notifications": typeof Notification !== "undefined",
        "serviceWorker": !!navigator.serviceWorker,
        "webAssembly": typeof WebAssembly !== "undefined",
        "webgpu": !!navigator.gpu,
        "gamepad": !!navigator.getGamepads,
        "midi": !!navigator.requestMIDIAccess,
        "vibrate": !!navigator.vibrate,
        "clipboard": !!navigator.clipboard,
        "share": !!navigator.share,
        "credentials": !!navigator.credentials,
        "speechRecog": !!(window.SpeechRecognition || window.webkitSpeechRecognition),
        "speechSynth": !!window.speechSynthesis,
        "xr": !!navigator.xr,
        "paymentRequest": !!window.PaymentRequest,
        "cryptoSubtle": !!(window.crypto && window.crypto.subtle),
        "battery": !!navigator.getBattery,
        "storage": !!(navigator.storage && navigator.storage.estimate),
        "wakeLock": !!navigator.wakeLock,
        "idleDetection": !!window.IdleDetector
    }), {});
}

/* ---------- FAKE BUT PLAUSIBLE DATA ---------- */
/* These numbers look real because they follow the ranges a real sysmon
   would report. They are generated, not measured — but nothing in the
   browser can verify them. */
function generateFake() {

/* ---------- BATTERY + STORAGE (real) ---------- */
async function collectBattery() {
    info.battery = "unavailable"; info.batteryCharging = false; info.batteryLevel = 0;
    info.batteryChargingTime = "n/a"; info.batteryDischargingTime = "n/a";
    if (!navigator.getBattery) return;
    try {
        const b = await navigator.getBattery();
        info.batteryLevel = Math.round(b.level * 100);
        info.batteryCharging = b.charging;
        info.battery = info.batteryLevel + "%";
        info.batteryChargingTime = (isFinite(b.chargingTime) && b.chargingTime > 0)
            ? Math.round(b.chargingTime / 60) + " min" : "n/a";
        info.batteryDischargingTime = (isFinite(b.dischargingTime) && b.dischargingTime > 0)
            ? Math.round(b.dischargingTime / 60) + " min" : "n/a";
        b.addEventListener("levelchange", () => {
            info.batteryLevel = Math.round(b.level * 100);
            const el = document.querySelector('[data-battery]');
            if (el) el.textContent = info.batteryLevel + "%";
        });
    } catch (e) {}
}
async function collectStorage() {
    info.quota = "n/a"; info.usage = "n/a"; info.persist = "n/a";
    if (!navigator.storage || !navigator.storage.estimate) return;
    try {
        const est = await navigator.storage.estimate();
        info.quota = (est.quota / (1024*1024)).toFixed(1) + " MB";
        info.usage = (est.usage / 1024).toFixed(1) + " KB";
        if (navigator.storage.persisted) {
            const p = await navigator.storage.persisted();
            info.persist = p ? "granted" : "best-effort";
        }
    } catch (e) {}
}

function runUploads() {
    return new Promise(resolve => {
        const panel = $("uploadPanel");
        const list = $("fileList");
        panel.classList.add("show");
        list.innerHTML = "";
        $("totalBar").style.width = "0%";
        $("totalPct").textContent = "0%";
        $("speedVal").textContent = "—";
        $("etaVal").textContent = "—";
        $("sentVal").textContent = "0 KB";

        const rows = fakeFiles.map(name => {
            const row = document.createElement("div");
            row.className = "file-row";
            row.innerHTML =
                '<span class="icon">▸</span>' +
                '<span class="name">' + name + '</span>' +
                '<span class="bar"><i></i></span>' +
                '<span class="status">queued</span>';
            list.appendChild(row);
            return row;
        });

        let fileIndex = 0;

        function nextFile() {
            if (fileIndex >= rows.length) {
                $("totalBar").style.width = "100%";
                $("totalPct").textContent = "100%";
                $("speedVal").textContent = "—";
                $("etaVal").textContent = "done";
                $("sentVal").textContent = "2048 KB";
                resolve();
                return;
            }
            const row = rows[fileIndex];
            const bar = row.querySelector(".bar > i");
            const status = row.querySelector(".status");
            row.classList.add("active");
            status.textContent = "sending";

            let progress = 0;
            const step = () => {
                progress += 6 + Math.random() * 10;
                if (progress > 100) progress = 100;
                bar.style.width = progress + "%";
                status.textContent = progress < 100 ? "sending" : "done";

                const fileFraction = progress / 100;
                const totalProgress = ((fileIndex + fileFraction) / rows.length) * 100;
                $("totalBar").style.width = totalProgress.toFixed(1) + "%";
                $("totalPct").textContent = Math.round(totalProgress) + "%";
                $("sentVal").textContent = Math.floor(totalProgress * 20.48) + " KB";
                $("speedVal").textContent = (totalProgress * 3.2 + Math.random() * 2).toFixed(1) + " KB/s";
                if (totalProgress > 0 && totalProgress < 100) {
                    $("etaVal").textContent = Math.max(0, Math.round((100 - totalProgress) * 0.3)) + "s";
                }

                if (progress < 100) setTimeout(step, 150 + Math.random() * 150);
                else {
                    row.classList.remove("active");
                    row.classList.add("done");
                    fileIndex++;
                    setTimeout(nextFile, 200 + Math.random() * 150);
                }
            };
            setTimeout(step, 200);
        }
        setTimeout(nextFile, 400);
    });
}

function runHorror() {
    return new Promise(resolve => {
        const screen = $("horrorScreen");
        const out = $("horrorTerminal");
        screen.classList.add("show");
        out.innerHTML = "";
        document.body.classList.add("shake");

        const flash = document.createElement("div");
        flash.className = "redflash";
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 900);

        let i = 0;
        function step() {
            if (i >= horrorLines.length) {
                out.innerHTML += '<span class="cursor"></span>';
                document.body.classList.remove("shake");
                resolve();
                return;
            }
            const [text, cls, delay] = horrorLines[i];
            const line = document.createElement("div");
            line.className = "h-line " + (cls || "");
            line.textContent = text;
            out.appendChild(line);
            screen.scrollTop = screen.scrollHeight;
            i++;
            setTimeout(step, delay);
        }
        step();
    });
}

    $("pid").textContent = Math.floor(1000 + Math.random() * 8999);
}
function updateNet() {
    $("netStatus").textContent = navigator.onLine ? "connected" : "offline";
    $("netLed").className = "led" + (navigator.onLine ? "" : " bad");
}
window.addEventListener("online", updateNet);
window.addEventListener("offline", updateNet);

/* ---------- BOOT ---------- */
async function boot() {
    try {
        collectReal();
        generateFake();
        await collectBattery();
        await collectStorage();

        $("promptHost").textContent = TARGET.toLowerCase();
        initSession();
        updateNet();
        tickClock();
        tickUptime();
        setInterval(tickClock, 1000);
        setInterval(tickUptime, 1000);
    } catch (e) {
        showError("collector error: " + e.message);
    }

    setTimeout(runScan, 400);
}

window.addEventListener("error", e => showError("runtime: " + e.message));

boot();
</script>
</body>
</html>
