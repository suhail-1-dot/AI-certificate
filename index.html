<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Security Lab</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #0f1115;
    color: #d0d0d0;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.4s;
}

.card {
    background: #1a1e26;
    border: 1px solid #2a3040;
    border-radius: 10px;
    padding: 40px 35px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    text-align: center;
    transition: all 0.3s;
}

.logo {
    font-size: 42px;
    margin-bottom: 10px;
}

h1 {
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
}

.subtitle {
    font-size: 13px;
    color: #7a8599;
    margin-bottom: 30px;
    letter-spacing: 0.3px;
}

.info-box {
    background: #12161d;
    border-left: 3px solid #3b82f6;
    padding: 14px 18px;
    text-align: left;
    font-size: 13px;
    color: #9aa4b8;
    line-height: 1.6;
    margin-bottom: 25px;
    border-radius: 4px;
}

.info-box strong { color: #d0d8e8; }

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.5px;
    transition: background 0.2s, transform 0.1s;
}

button:hover { background: #1d4ed8; }
button:active { transform: scale(0.98); }

#status {
    margin-top: 20px;
    font-size: 13px;
    min-height: 20px;
    color: #7a8599;
}

/* ============ GLITCH / PRANK SCREEN ============ */
#prankScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: #bdbdbd;
    padding: 25px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.7;
    z-index: 9999;
    overflow-y: auto;
}

#terminal {
    max-width: 900px;
    margin: auto;
    white-space: pre-wrap;
}

.ok { color: #9a9a9a; }
.warning { color: #c7aa48; }
.error { color: #d05a5a; }
.critical { color: #e05b5b; font-weight: bold; }
.creepy { color: #8b0000; font-weight: bold; letter-spacing: 3px; }
.big { font-size: 20px; letter-spacing: 4px; }

.cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #ccc;
    animation: blink 1s infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.glitch {
    position: relative;
    color: #e05b5b;
    font-weight: bold;
}
.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    overflow: hidden;
}
.glitch::before {
    color: #00ffff;
    animation: glitchTop 0.4s infinite linear alternate-reverse;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
}
.glitch::after {
    color: #ff00ff;
    animation: glitchBot 0.4s infinite linear alternate-reverse;
    clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
}
@keyframes glitchTop {
    0% { transform: translate(2px, -2px); }
    100% { transform: translate(-2px, 2px); }
}
@keyframes glitchBot {
    0% { transform: translate(-2px, 2px); }
    100% { transform: translate(2px, -2px); }
}

.shake { animation: shake 0.3s infinite; }
@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-3px,2px); }
    50% { transform: translate(3px,-2px); }
    75% { transform: translate(-2px,-3px); }
    100% { transform: translate(2px,3px); }
}

.redFlash {
    position: fixed; inset: 0;
    background: red; opacity: 0;
    pointer-events: none;
    z-index: 10000;
    animation: flash 0.25s 3;
}
@keyframes flash {
    0% { opacity: 0; }
    50% { opacity: 0.6; }
    100% { opacity: 0; }
}

#escapeBtn {
    position: fixed;
    bottom: 20px; right: 20px;
    background: #2a2a2a;
    color: #0f0;
    border: 2px solid #0f0;
    padding: 12px 20px;
    font-family: monospace;
    font-size: 13px;
    cursor: pointer;
    z-index: 10005;
    border-radius: 6px;
    letter-spacing: 1px;
}
#escapeBtn:hover { background: #0f0; color: #000; }

#matrixCanvas {
    position: fixed; inset: 0;
    z-index: 9998;
    opacity: 0.3;
    pointer-events: none;
}

/* fake error popup */
.popup {
    position: fixed;
    background: #1a0000;
    border: 2px solid #8b0000;
    color: #ff4d4d;
    padding: 12px 18px;
    font-family: Consolas, monospace;
    font-size: 13px;
    box-shadow: 0 0 20px #8b0000;
    z-index: 10001;
    max-width: 300px;
    animation: popIn 0.2s ease-out;
}
@keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>

<!-- ================= NORMAL PAGE ================= -->
<div class="card" id="mainCard">
    <div class="logo">🔒</div>
    <h1>Browser Security Lab</h1>
    <div class="subtitle">Device Capability Verification · v2.4.1</div>

    <div class="info-box">
        <strong>Purpose:</strong> This diagnostic tool checks whether your browser
        can access hardware devices. It is used to verify permissions before
        running AI-based computer vision models.<br><br>
        <strong>Note:</strong> No image or video data is stored or transmitted.
    </div>

    <button id="cameraButton">▶ Grant Camera Access &amp; Run Diagnostic</button>
    <div id="status"></div>
</div>

<!-- ================= PRANK SCREEN ================= -->
<div id="prankScreen">
    <canvas id="matrixCanvas"></canvas>
    <div id="terminal"></div>
    <button id="escapeBtn">[ ESC TO STOP PRANK ]</button>
</div>

<script>
/* ============================================================
   NORMAL PAGE LOGIC
   ============================================================ */
const result = document.getElementById("status");
const cameraButton = document.getElementById("cameraButton");
const mainCard = document.getElementById("mainCard");
const prankScreen = document.getElementById("prankScreen");
const terminal = document.getElementById("terminal");
const escapeBtn = document.getElementById("escapeBtn");

let stopped = false;
let timeouts = [];
let popupCount = 0;

/* ============================================================
   THE PRANK — triggered when camera permission is GRANTED
   ============================================================ */
const prankLines = [
    ["$ access granted. initializing capture module...", "", 700],
    ["[ OK ] video stream acquired", "ok", 700],
    ["$ analyzing facial structure...", "", 900],
    ["[ OK ] identity signature extracted", "ok", 800],
    ["$ matching against local profiles...", "", 1000],
    ["[WARNING] profile match found: BROTHER_01", "warning", 1100],
    ["", "", 500],
    ["$ deploying counter-prank payload...", "", 900],
    ["[ OK ] payload delivered", "ok", 800],
    ["", "", 500],
    ["😈  G O T C H A  😈", "creepy big", 1500],
    ["", "", 600],
    ["HEY BROTHER.", "creepy big", 1400],
    ["", "", 500],
    ["I AM NOT AFRAID.", "creepy big", 1400],
    ["", "", 500],
    ["YOU THOUGHT YOU COULD PRANK ME?", "warning", 1500],
    ["", "", 500],
    ["I LAUGHED. 😂", "warning", 1200],
    ["", "", 500],
    ["NOW IT'S YOUR TURN.", "critical", 1400],
    ["", "", 600],
    ["----------------------------------------", "", 400],
    ["THIS WAS A PRANK. NOTHING WAS HACKED.", "", 1000],
    ["YOUR CAMERA IS SAFE. YOUR DATA IS SAFE.", "ok", 900],
    ["YOU JUST GOT PRANKED BY YOUR BROTHER. 😄", "ok", 1200],
    ["----------------------------------------", "", 400],
    ["", "", 400],
    ["Press ESC or click the green button to exit.", "ok", 800]
];

function showLine(index) {
    if (stopped) return;
    if (index >= prankLines.length) {
        terminal.innerHTML += '<span class="cursor"></span>';
        return;
    }
    const item = prankLines[index];
    const line = document.createElement("div");
    line.textContent = item[0];
    if (item[1] === "creepy big") {
        line.className = "glitch creepy big";
        line.setAttribute("data-text", item[0]);
    } else if (item[1] === "creepy") {
        line.className = "glitch creepy";
        line.setAttribute("data-text", item[0]);
    } else if (item[1]) {
        line.className = item[1];
    }
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
    const t = setTimeout(() => showLine(index + 1), item[2]);
    timeouts.push(t);
}

/* creepy popups */
const popupMessages = [
    "⚠ CAMERA FEED ACTIVE",
    "⚠ FACE RECOGNIZED",
    "⚠ BROTHER DETECTED",
    "⚠ PRANK COUNTERMEASURES DEPLOYED",
    "⚠ YOU'VE BEEN PRANKED 😈",
    "⚠ IT'S JUST A JOKE, RELAX 😄"
];

function spawnPopup() {
    if (stopped || popupCount > 5) return;
    const popup = document.createElement("div");
    popup.className = "popup";
    popup.textContent = popupMessages[popupCount % popupMessages.length];
    const x = Math.random() * (window.innerWidth - 320);
    const y = Math.random() * (window.innerHeight - 100);
    popup.style.left = Math.max(10, x) + "px";
    popup.style.top = Math.max(10, y) + "px";
    document.body.appendChild(popup);
    popupCount++;
    const t = setTimeout(() => popup.remove(), 2500);
    timeouts.push(t);
    const t2 = setTimeout(spawnPopup, 1200 + Math.random() * 1200);
    timeouts.push(t2);
}

/* matrix rain */
function startMatrix() {
    const canvas = document.getElementById("matrixCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = "01アイウエオカキクケコサシスセソABCDEF";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        if (stopped) return;
        ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#8b0000";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
        requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
}

function redFlash() {
    const flash = document.createElement("div");
    flash.className = "redFlash";
    document.body.appendChild(flash);
    const t = setTimeout(() => flash.remove(), 900);
    timeouts.push(t);
}

function beginPrank() {
    mainCard.style.display = "none";
    prankScreen.style.display = "block";
    terminal.innerHTML = "";
    document.body.classList.add("shake");
    startMatrix();
    showLine(0);
    const t1 = setTimeout(spawnPopup, 1500);
    timeouts.push(t1);
    const t2 = setTimeout(redFlash, 2500);
    timeouts.push(t2);
    const t3 = setTimeout(() => document.body.classList.remove("shake"), 6000);
    timeouts.push(t3);
}

/* ============================================================
   STOP / RESET
   ============================================================ */
function stopPrank() {
    if (stopped) return;
    stopped = true;
    timeouts.forEach(t => clearTimeout(t));
    timeouts = [];
    document.querySelectorAll(".popup").forEach(p => p.remove());
    document.body.classList.remove("shake");
    prankScreen.style.display = "none";
    mainCard.style.display = "block";
    result.textContent = "✅ Diagnostic complete. You got pranked. 😄";
    result.style.color = "#4ade80";
    stopped = false; // allow re-trigger
}

escapeBtn.addEventListener("click", stopPrank);
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") stopPrank();
});

/* ============================================================
   CAMERA BUTTON — the actual trigger
   ============================================================ */
cameraButton.addEventListener("click", async function () {
    result.textContent = "Requesting camera permission...";
    result.style.color = "#7a8599";

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });

        // Permission GRANTED → run the prank
        result.textContent = "Camera permission granted. Running diagnostic...";
        result.style.color = "#4ade80";

        // stop the camera immediately (we don't actually record)
        stream.getTracks().forEach(track => track.stop());

        // small delay, then unleash the prank
        setTimeout(() => {
            beginPrank();
        }, 800);

    } catch (error) {
        // Permission DENIED → behave like a normal page
        result.textContent = "❌ Camera permission was denied or unavailable.";
        result.style.color = "#ef4444";
    }
});
</script>

</body>
</html>
